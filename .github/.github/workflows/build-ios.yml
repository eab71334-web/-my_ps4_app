name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy toolchain
        brew install autoconf automake libtool pkg-config sqlite3

    - name: Build Xcode Project with kivy-ios
      run: |
        toolchain build python3 kivy
        toolchain create MyApp main.py

    - name: Upload Xcode Project Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Xcode-Project
        path: MyApp-ios
